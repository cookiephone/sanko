[workspace]
resolver = "3"
members = [
    "crates/sanko-core",
    "crates/sanko-search",
    "crates/sanko-cli",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Sami Kharma"]
repository = "https://github.com/cookiephone/sanko"

[workspace.dependencies]
sanko-core = { path = "crates/sanko-core", version = "0.5.1" }
sanko-search = { path = "crates/sanko-search", version = "0.5.1" }

proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Board-point counts (`BitBoard::count`, `NPOINTS`) are tiny and only cast to
# i32 for score arithmetic. They cannot reach a value that flips sign.
cast_possible_wrap = "allow"
# Nursery lint. Its `map_or(_else)` rewrites are less readable than the
# match/if-let forms used for node allocation and the rollout cache.
option_if_let_else = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.release-with-debug]
inherits = "release"
debug = "full"
strip = "none"

[profile.bench]
inherits = "release"
debug = "full"
strip = "none"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
debug = "full"
strip = "none"
lto = "fat"
codegen-units = 1
