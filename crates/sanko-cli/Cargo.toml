[package]
name = "sanko-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "Command-line driver for the Sanko Go solver."

[[bin]]
name = "sanko"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sanko-core.workspace = true
sanko-search.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help"] }
anstream = "0.6"
anstyle = "1.0"
terminal_size = "0.4"
