[package]
name = "sanko"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Solves Go on small rectangular boards under positional superko (command-line solver)."
keywords = ["go", "baduk", "solver", "proof-number-search", "game-tree"]
categories = ["games", "command-line-utilities", "science"]

[[bin]]
name = "sanko"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
sanko-core.workspace = true
sanko-search.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help"] }
anstream = "0.6"
anstyle = "1.0"
terminal_size = "0.4"
